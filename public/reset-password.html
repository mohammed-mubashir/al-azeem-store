<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — AL AZEEM TRADERS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="stamp">AA</div>
    <h1>Set a new password</h1>
    <p class="auth-sub" id="resetSub">Enter your new password below.</p>

    <form id="resetForm">
      <div class="field">
        <label>New password</label>
        <input type="password" id="newPassword" required minlength="4">
      </div>
      <div class="form-msg" id="resetMsg"></div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" type="submit">Reset Password</button>
    </form>

    <p class="auth-switch"><a href="/login.html">← Back to login</a></p>
  </div>
</div>
<script>
const API = "/api";
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
const form = document.getElementById("resetForm");
const msg = document.getElementById("resetMsg");

if (!token) {
  document.getElementById("resetSub").textContent = "This reset link is missing its token — please use the link from your email.";
  form.style.display = "none";
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.style.display = "none";
  const password = document.getElementById("newPassword").value;
  try {
    const res = await fetch(`${API}/auth/customer/reset-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Could not reset password.");
    msg.textContent = "Password reset! Redirecting to login...";
    msg.className = "form-msg success";
    setTimeout(() => (window.location.href = "/login.html"), 1500);
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "form-msg error";
  }
});
</script>
</body>
</html>
