<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — AL AZEEM TRADERS</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="stamp">AA</div>
    <h1>Forgot your password?</h1>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgotForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="forgotEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-msg" id="forgotMsg"></div>
      <button class="btn btn-primary btn-block" style="margin-top:18px;" type="submit">Send Reset Link</button>
    </form>

    <p class="auth-switch"><a href="/login.html">← Back to login</a></p>
  </div>
</div>
<script>
const API = "/api";
document.getElementById("forgotForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("forgotMsg");
  msg.style.display = "none";
  const email = document.getElementById("forgotEmail").value.trim();
  try {
    const res = await fetch(`${API}/auth/customer/forgot-password`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    msg.textContent = data.message || "If an account exists for that email, a reset link has been sent.";
    msg.className = "form-msg success";
  } catch (err) {
    msg.textContent = "Something went wrong. Please try again.";
    msg.className = "form-msg error";
  }
});
</script>
</body>
</html>
