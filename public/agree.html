<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Before You Continue — AL AZEEM TRADERS</title>

  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <div class="auth-wrap">

    <div class="auth-card">

      <div class="stamp">AA</div>

      <h1>Before You Continue</h1>

      <p class="auth-sub">
        Please review our store policies before continuing to AL AZEEM
        KIRANA &amp; GENERAL STORE.
      </p>


      <div style="
        margin-top:22px;
        padding:18px;
        border:1px solid rgba(0,0,0,.08);
        border-radius:12px;
        background:rgba(0,0,0,.02);
        text-align:left;
      ">

        <p style="margin-top:0;">
          Please take a moment to review:
        </p>

        <p>
          📕
          <a href="/rules.html" target="_blank">
            Store Rule Book
          </a>
        </p>

        <p>
          📜
          <a href="/terms.html" target="_blank">
            Terms &amp; Conditions
          </a>
        </p>

        <p style="margin-bottom:0;">
          🔒
          <a href="/privacy.html" target="_blank">
            Privacy Policy
          </a>
        </p>

      </div>


      <label style="
        display:flex;
        align-items:flex-start;
        gap:10px;
        margin-top:20px;
        text-align:left;
        font-size:13px;
        line-height:1.5;
        cursor:pointer;
      ">

        <input
          type="checkbox"
          id="agreeCheckbox"
          style="margin-top:3px;"
        >

        <span>
          I have read and agree to the
          <a href="/rules.html" target="_blank">Store Rule Book</a>
          and
          <a href="/terms.html" target="_blank">Terms &amp; Conditions</a>,
          and I acknowledge the
          <a href="/privacy.html" target="_blank">Privacy Policy</a>.
        </span>

      </label>


      <div
        id="agreeMsg"
        class="form-msg error"
        style="display:none;margin-top:15px;"
      ></div>


      <button
        id="continueBtn"
        class="btn btn-primary btn-block"
        style="margin-top:18px;"
      >
        Continue to Store
      </button>


      <p class="auth-switch" style="margin-top:18px;">
        By continuing, you confirm that you have reviewed the
        information above.
      </p>

    </div>

  </div>


  <script src="/js/store.js" data-page="agree"></script>

</body>
</html>
